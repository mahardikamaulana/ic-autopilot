name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # the built userscript must match src/ (it is what auto-update serves)
      - run: bun build.js --check
      - run: bun test/toolkit-test.js
      - run: bun test/early-game-sim.js all 44
